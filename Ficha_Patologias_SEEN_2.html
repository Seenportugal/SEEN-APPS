<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Ficha de Patologias &middot; SEEN</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f0f2f7; --surface: #ffffff; --surface2: #e8ecf3;
    --border: #d0d7e6; --accent: #2c6fe0; --accent2: #12a87a;
    --danger: #e03c3c; --warn: #d48b00;
    --text: #1a2035; --text2: #4a5570; --text3: #8a96aa;
    --radius: 10px; --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --serif: 'DM Serif Display', Georgia, serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding-bottom: 60px; }

  /* TOPBAR */
  .topbar { position: sticky; top: 0; z-index: 50; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .topbar-row { display: flex; align-items: center; gap: 10px; }
  .brand { flex: 1; min-width: 0; }
  .brand-title { font-family: var(--serif); font-size: 19px; line-height: 1.15; }
  .brand-sub { font-size: 10px; font-family: var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); margin-top: 1px; }
  .counter { flex-shrink: 0; text-align: right; }
  .counter-val { font-family: var(--mono); font-size: 15px; color: var(--accent2); font-weight: 500; }
  .counter-label { font-size: 9px; color: var(--text3); font-family: var(--mono); letter-spacing: 0.8px; text-transform: uppercase; }
  .toolbar { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .search-wrap { position: relative; flex: 1; min-width: 140px; }
  .search-wrap input { width: 100%; padding: 8px 12px 8px 30px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; font-family: var(--sans); outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 12px; }

  .btn { padding: 8px 13px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: var(--sans); transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4f8ef7; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-success { background: var(--accent2); color: #06251a; }
  .btn-success:hover { background: #29d19c; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: rgba(224,60,60,0.08); }
  .btn-sm { padding: 5px 9px; font-size: 11px; }
  .btn-full { width: 100%; justify-content: center; }

  /* HEADER FORM (dados da visita) */
  .content { max-width: 720px; margin: 0 auto; padding: 16px 14px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .panel-title { font-size: 10px; font-family: var(--mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.7px; text-transform: uppercase; color: var(--text2); }
  .form-input, .form-textarea { padding: 9px 11px; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 13px; font-family: var(--sans); outline: none; width: 100%; }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 56px; }

  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }

  /* PATHOLOGY LIST */
  .list-section-title { font-size: 10px; font-family: var(--mono); letter-spacing: 1.4px; text-transform: uppercase; color: var(--text3); margin: 18px 0 8px; padding: 0 2px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 9px; overflow: hidden; transition: border-color 0.15s; }
  .card.observed { border-color: rgba(44,111,224,0.35); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; }
  .card-head:hover { background: var(--surface2); }
  .num-badge { flex-shrink: 0; font-family: var(--mono); font-size: 10px; color: var(--text3); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; min-width: 22px; text-align: center; }
  .card.observed .num-badge { color: var(--accent); border-color: var(--accent); background: rgba(44,111,224,0.08); }
  .card-title { flex: 1; font-size: 13px; font-weight: 500; line-height: 1.35; }
  .card-meta { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
  .photo-count { font-size: 10px; font-family: var(--mono); color: var(--text3); display: flex; align-items: center; gap: 3px; }
  .toggle { flex-shrink: 0; width: 38px; height: 22px; border-radius: 11px; background: var(--border); position: relative; transition: background 0.15s; }
  .toggle.on { background: var(--accent2); }
  .toggle-dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .toggle.on .toggle-dot { left: 18px; }
  .chevron { flex-shrink: 0; color: var(--text3); font-size: 11px; transition: transform 0.15s; }
  .chevron.open { transform: rotate(90deg); }

  .card-body { padding: 4px 14px 16px; border-top: 1px solid var(--border); }
  .field-block { margin-top: 12px; }
  .field-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.7px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; display: block; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; color: var(--text2); transition: all 0.15s; user-select: none; background: var(--bg); }
  .chip input { display: none; }
  .chip.checked { border-color: var(--accent); background: rgba(44,111,224,0.1); color: var(--text); }
  .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
  .chip.checked .chip-dot { background: var(--accent); }

  .photo-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .photo-thumb { position: relative; width: 74px; height: 74px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .photo-del { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(20,25,40,0.75); color: #fff; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .photo-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .photo-add-row .btn { flex: 1; justify-content: center; }

  .custom-title-input { font-size: 13px; font-weight: 500; font-family: var(--sans); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; width: 100%; outline: none; }
  .custom-title-input:focus { border-color: var(--accent); }
  .remove-custom { margin-top: 10px; }

  .empty-state { text-align: center; padding: 30px 16px; color: var(--text3); font-size: 13px; }

  /* LIGHTBOX */
  .lightbox { position: fixed; inset: 0; background: rgba(10,14,26,0.9); z-index: 300; display: none; align-items: center; justify-content: center; padding: 24px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  .lightbox-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.12); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }

  /* MODAL (resumo) */
  .modal-overlay { position: fixed; inset: 0; background: rgba(30,40,80,0.45); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; overflow-y: auto; padding: 30px 14px; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 820px; max-width: 100%; padding: 24px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-title { font-family: var(--serif); font-size: 19px; }
  .close-btn { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; line-height: 1; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }

  #summary-output { background: #fff; color: #1a1a1a; border: 1px solid var(--border); border-radius: 8px; padding: 26px 30px; font-family: Georgia, serif; font-size: 13px; line-height: 1.7; max-height: 60vh; overflow-y: auto; }
  #summary-output h2 { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; background: #f0f0f0; border: 1px solid #ddd; padding: 6px 12px; margin: 18px 0 10px; }
  #summary-output h2:first-child { margin-top: 0; }
  #summary-output .p-header { font-family: Arial, sans-serif; font-weight: bold; font-size: 13.5px; margin-bottom: 4px; }
  #summary-output .p-row { margin-bottom: 3px; }
  #summary-output .p-row b { font-family: Arial, sans-serif; }
  #summary-output .p-block { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed #ccc; }
  #summary-output .p-photos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #summary-output .p-photos img { width: 90px; height: 90px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
  #summary-header-box { border: 1px solid #bbb; padding: 10px 16px; margin-bottom: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 11.5px; background: #f8f8f8; font-family: Arial, sans-serif; border-radius: 4px; }

  /* TOAST */
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; font-size: 12.5px; z-index: 400; transition: transform 0.25s; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-left: 3px solid var(--accent2); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }

  #import-input, .file-input-hidden { display: none; }

  @media print {
    body * { visibility: hidden; }
    #summary-output, #summary-output * { visibility: visible; }
    #summary-output { position: absolute; left: 0; top: 0; width: 100%; max-height: none; overflow: visible; border: none; padding: 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="brand-title">Ficha de Patologias</div>
      <div class="brand-sub">Registo de Visita &middot; SEEN</div>
    </div>
    <div class="counter">
      <div class="counter-val" id="counter-val">0 / 28</div>
      <div class="counter-label">observadas</div>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input type="text" id="search-input" placeholder="Pesquisar patologia&hellip;" oninput="renderList()"/>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('import-input').click()">&#128193; Importar</button>
    <button class="btn btn-ghost btn-sm" onclick="exportJSON()">&#128190; Exportar</button>
    <button class="btn btn-success btn-sm" onclick="openSummary()">&#128203; Resumo</button>
  </div>
</div>
<input type="file" id="import-input" accept="application/json" onchange="importJSON(this.files[0])"/>

<div class="content">

  <div class="panel">
    <div class="panel-title">Dados da Visita</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Processo N.&ordm;</label>
        <input class="form-input" id="hd-processo" placeholder="ex: 118.02.2026" oninput="markDirty()"/>
      </div>
      <div class="form-group">
        <label class="form-label">Data da visita</label>
        <input class="form-input" id="hd-data" type="date" oninput="markDirty()"/>
      </div>
      <div class="form-group full">
        <label class="form-label">Edif&iacute;cio / Morada</label>
        <input class="form-input" id="hd-edificio" placeholder="Nome ou morada do edif&iacute;cio" oninput="markDirty()"/>
      </div>
      <div class="form-group">
        <label class="form-label">Localidade</label>
        <input class="form-input" id="hd-localidade" placeholder="ex: Aveiro" oninput="markDirty()"/>
      </div>
      <div class="form-group">
        <label class="form-label">T&eacute;cnico(s)</label>
        <input class="form-input" id="hd-tecnico" placeholder="Nome(s)" oninput="markDirty()"/>
      </div>
      <div class="form-group full">
        <label class="form-label">Fra&ccedil;&otilde;es / zonas visitadas</label>
        <input class="form-input" id="hd-fracoes" placeholder="ex: A, C, F, zonas comuns" oninput="markDirty()"/>
      </div>
    </div>
  </div>

  <div class="list-section-title">Patologias t&iacute;picas (listagem SEEN)</div>
  <div id="list-predef"></div>

  <div class="list-section-title">Outras patologias observadas nesta visita</div>
  <div id="list-custom"></div>
  <button class="btn btn-ghost btn-full" onclick="addCustom()">&#65291; Adicionar patologia n&atilde;o listada</button>

  <div style="margin-top:22px">
    <button class="btn btn-primary btn-full" onclick="saveAndNew()">&#128190; Guardar ficha e iniciar nova</button>
  </div>

  <div style="margin-top:9px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-danger btn-sm" onclick="resetAll()">&#128465; Limpar ficha (sem guardar)</button>
  </div>

</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&#10005;</button>
  <img id="lightbox-img" src="" onclick="event.stopPropagation()"/>
</div>

<!-- MODAL RESUMO -->
<div class="modal-overlay" id="modal-summary">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">Resumo da Visita</span>
      <button class="close-btn" onclick="closeSummary()">&#10005;</button>
    </div>
    <div id="summary-output"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeSummary()">Fechar</button>
      <button class="btn btn-ghost" onclick="copySummaryText()">&#128203; Copiar texto</button>
      <button class="btn btn-primary" onclick="window.print()">&#128424; Imprimir / PDF</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DADOS BASE (Listagem das Patologias Observadas — SEEN, processos 100 a 125) ──
const PATOLOGIAS = [{"num": 1, "tipo": "Fissuração de revestimentos, rebocos e alvenarias", "elementos": ["Alçados", "Coberturas", "Terraços"], "causas": ["Movimentos higrotérmicos", "retração de argamassas", "movimentos estruturais diferenciais"]}, {"num": 2, "tipo": "Fissuração / degradação de elementos em pedra natural", "elementos": ["Padieiras", "soleiras", "parapeitos", "peitoris"], "causas": ["Porosidade do material", "exposição a ciclos gelo-degelo", "comportamento higrotérmico deficiente"]}, {"num": 3, "tipo": "Destacamento ou perda de aderência de revestimento cerâmico/pétreo", "elementos": ["Alçados", "Terraços"], "causas": ["Deficiências de ligação ao suporte", "envelhecimento do material", "movimentações higrotérmicas"]}, {"num": 4, "tipo": "Degradação ou ausência de rejuntamento", "elementos": ["Alçados", "Terraços"], "causas": ["Fim de vida útil do material", "exposição às intempéries"]}, {"num": 5, "tipo": "Degradação de juntas de dilatação", "elementos": ["Alçados", "Terraços"], "causas": ["Movimentos térmicos", "fim de vida útil dos materiais de selagem"]}, {"num": 6, "tipo": "Eflorescências e carbonatação", "elementos": ["Alçados", "Terraços", "Coberturas"], "causas": ["Migração de sais solúveis por presença de água/humidade nas camadas subjacentes"]}, {"num": 7, "tipo": "Colonização biológica (líquenes, musgos, vegetação)", "elementos": ["Coberturas", "Alçados"], "causas": ["Retenção de humidade", "ausência de manutenção", "orientação com menor insolação"]}, {"num": 8, "tipo": "Sujidade superficial generalizada", "elementos": ["Coberturas", "Alçados"], "causas": ["Deposição de poeiras e partículas atmosféricas", "ausência de limpeza periódica"]}, {"num": 9, "tipo": "Oxidação/corrosão de elementos metálicos", "elementos": ["Guardas", "tubos de queda", "caleiras", "rufagens", "estendais"], "causas": ["Degradação da camada de proteção/pintura", "exposição continuada às intempéries"]}, {"num": 10, "tipo": "Corrosão de armaduras / degradação do betão armado", "elementos": ["Consolas", "vigas", "lajes"], "causas": ["Carbonatação e despassivação das armaduras por infiltração/humidade persistente"]}, {"num": 11, "tipo": "Degradação de vedantes, mastique e remates de caixilharias", "elementos": ["Vãos envidraçados", "Claraboias"], "causas": ["Envelhecimento e perda de elasticidade dos materiais de selagem"]}, {"num": 12, "tipo": "Fraco desempenho térmico / ausência de isolamento", "elementos": ["Paredes", "Cobertura", "Vãos envidraçados"], "causas": ["Soluções construtivas sem isolamento térmico", "correntes na época de construção", "não cumprem o REH"]}, {"num": 13, "tipo": "Condensações superficiais, bolores e fungos (interior)", "elementos": ["Interior das frações"], "causas": ["Pontes térmicas", "ventilação insuficiente", "humidade interior elevada"]}, {"num": 14, "tipo": "Infiltrações e perda de estanqueidade — cobertura", "elementos": ["Cobertura", "caleiras", "claraboias", "corpos emergentes"], "causas": ["Fim de vida útil da impermeabilização", "más práticas de aplicação", "pendentes inadequadas"]}, {"num": 15, "tipo": "Infiltrações e perda de estanqueidade — terraços e varandas", "elementos": ["Terraços", "varandas"], "causas": ["Falhas de impermeabilização", "remates deficientes", "pendentes incorretas"]}, {"num": 16, "tipo": "Deficiências no sistema de drenagem de águas pluviais", "elementos": ["Caleiras", "tubos de queda"], "causas": ["Secções subdimensionadas", "pendentes incorretas", "ausência de ligações"]}, {"num": 17, "tipo": "Humidade ascensional", "elementos": ["Pisos enterrados", "Garagens"], "causas": ["Ausência de barreira impermeável eficaz em elementos em contacto com o terreno"]}, {"num": 18, "tipo": "Infiltrações em garagens/pisos enterrados", "elementos": ["Garagens"], "causas": ["Falhas de impermeabilização de pavimentos sobrejacentes", "caixas de visita degradadas"]}, {"num": 19, "tipo": "Degradação de pinturas e acabamentos interiores", "elementos": ["Interior", "Garagens", "Zonas comuns"], "causas": ["Fim de vida útil do revestimento", "infiltrações", "ausência de manutenção"]}, {"num": 20, "tipo": "Degradação do sistema de drenagem de águas residuais/saneamento", "elementos": ["Caixas de visita", "coletores", "rede pública"], "causas": ["Fim de vida útil dos componentes", "ausência de manutenção"]}, {"num": 21, "tipo": "Anomalias de conceção ou execução", "elementos": ["Diversos elementos"], "causas": ["Más práticas construtivas", "subdimensionamento", "deficiências de projeto"]}, {"num": 22, "tipo": "Degradação de pinturas e acabamentos exteriores", "elementos": ["Alçados", "Varandas (paramentos em reboco ou betão à vista)"], "causas": ["Exposição às intempéries", "fim de vida útil da tinta", "pingadeiras ausentes ou ineficazes"]}, {"num": 23, "tipo": "Fugas em redes prediais de abastecimento de água", "elementos": ["Redes prediais de água (zonas comuns, caixas de contadores)"], "causas": ["Degradação de ligações", "válvulas e uniões roscadas por fim de vida útil"]}, {"num": 24, "tipo": "Assentamento ou abatimento de pavimentos exteriores", "elementos": ["Pavimentos exteriores (calçada, zonas comuns)"], "causas": ["Perda ou instabilidade do substrato de assentamento"]}, {"num": 25, "tipo": "Manchas de termoforese associadas a pontes térmicas", "elementos": ["Alçados (zonas de pilares, vigas e bordos de laje)"], "causas": ["Deposição diferencial de partículas sobre zonas de menor temperatura superficial (pontes térmicas)"]}, {"num": 26, "tipo": "Presença de fibrocimento com amianto", "elementos": ["Cobertura (painéis de fibrocimento)"], "causas": ["Material de construção da época", "atualmente obsoleto e não conforme à legislação em vigor"]}, {"num": 27, "tipo": "Degradação de revestimentos impermeabilizantes aplicados em fachada (membrana líquida/asfáltica)", "elementos": ["Alçados (base junto à soleira)"], "causas": ["Fim de vida útil de intervenção de impermeabilização anteriormente aplicada na fachada"]}, {"num": 28, "tipo": "Estagnação de água em perfis de drenagem da caixilharia", "elementos": ["Vãos envidraçados", "Caixilharias"], "causas": ["Geometria e drenagem inadequadas dos perfis", "promovendo biofilmes", "manchas e corrosão"]}];

let state = {
  header: { processo:'', data:'', edificio:'', localidade:'', tecnico:'', fracoes:'' },
  patologias: [],  // predefinidas, id = 'p'+num
  custom: []        // adicionadas na visita, id = 'c'+n
};
let dirty = false;
let expandedIds = new Set();
let customSeq = 1;

function initState() {
  state.patologias = PATOLOGIAS.map(p => ({
    id: 'p'+p.num, num: p.num, tipo: p.tipo,
    elementos: p.elementos, causas: p.causas,
    observada: false,
    elementosSel: p.elementos.map(()=>false),
    elementoOutro: '',
    causasSel: p.causas.map(()=>false),
    causaOutro: '',
    local: '', obs: '', fotos: []
  }));
  state.custom = [];
  document.getElementById('hd-data').value = new Date().toISOString().split('T')[0];
}
initState();

function markDirty(){ dirty = true; }

window.addEventListener('beforeunload', function(e){
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// ── HELPERS ──────────────────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function readHeader(){
  state.header.processo = document.getElementById('hd-processo').value.trim();
  state.header.data = document.getElementById('hd-data').value;
  state.header.edificio = document.getElementById('hd-edificio').value.trim();
  state.header.localidade = document.getElementById('hd-localidade').value.trim();
  state.header.tecnico = document.getElementById('hd-tecnico').value.trim();
  state.header.fracoes = document.getElementById('hd-fracoes').value.trim();
}
function writeHeader(){
  document.getElementById('hd-processo').value = state.header.processo||'';
  document.getElementById('hd-data').value = state.header.data||'';
  document.getElementById('hd-edificio').value = state.header.edificio||'';
  document.getElementById('hd-localidade').value = state.header.localidade||'';
  document.getElementById('hd-tecnico').value = state.header.tecnico||'';
  document.getElementById('hd-fracoes').value = state.header.fracoes||'';
}
function formatDatePT(d){
  if (!d) return '—';
  try { return new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'long',year:'numeric'}); }
  catch(e){ return d; }
}
function findItem(id){
  return state.patologias.find(p=>p.id===id) || state.custom.find(p=>p.id===id);
}

// ── RENDER ───────────────────────────────────────────────────────────────
function cardHTML(item){
  const isCustom = item.id.startsWith('c');
  const isOpen = expandedIds.has(item.id);
  const nElem = item.elementosSel.filter(Boolean).length + (item.elementoOutro.trim()?1:0);
  const nCausa = item.causasSel.filter(Boolean).length + (item.causaOutro.trim()?1:0);

  let titleHTML;
  if (isCustom) {
    titleHTML = `<input class="custom-title-input" placeholder="Descreva a patologia observada&hellip;" value="${esc(item.tipo)}"
      onclick="event.stopPropagation()" oninput="updateCustomTitle('${item.id}', this.value)"/>`;
  } else {
    titleHTML = `<span class="card-title">${esc(item.tipo)}</span>`;
  }

  let body = '';
  if (isOpen) {
    const elemChips = item.elementos.map((el,i)=>`
      <label class="chip ${item.elementosSel[i]?'checked':''}" onclick="event.stopPropagation()">
        <input type="checkbox" ${item.elementosSel[i]?'checked':''} onchange="toggleElemento('${item.id}',${i},this.checked)"/>
        <span class="chip-dot"></span>${esc(el)}
      </label>`).join('');

    const causaChips = item.causas.map((c,i)=>`
      <label class="chip ${item.causasSel[i]?'checked':''}" onclick="event.stopPropagation()">
        <input type="checkbox" ${item.causasSel[i]?'checked':''} onchange="toggleCausa('${item.id}',${i},this.checked)"/>
        <span class="chip-dot"></span>${esc(c)}
      </label>`).join('');

    const photosHTML = item.fotos.map((f,i)=>`
      <div class="photo-thumb">
        <img src="${f.dataUrl}" onclick="event.stopPropagation();openLightbox('${item.id}',${i})"/>
        <button class="photo-del" onclick="event.stopPropagation();removePhoto('${item.id}',${i})">&#10005;</button>
      </div>`).join('');

    body = `
    <div class="card-body" onclick="event.stopPropagation()">
      ${(item.elementos.length || true) ? `
      <div class="field-block">
        <span class="field-label">Elemento construtivo</span>
        <div class="chip-group">${elemChips}</div>
        <input class="form-input" style="margin-top:7px" placeholder="Outro elemento (especificar)&hellip;"
          value="${esc(item.elementoOutro)}" oninput="updateOutro('${item.id}','elementoOutro',this.value)"/>
      </div>` : ''}

      <div class="field-block">
        <span class="field-label">Causa prov&aacute;vel</span>
        <div class="chip-group">${causaChips}</div>
        <input class="form-input" style="margin-top:7px" placeholder="Outra causa (especificar)&hellip;"
          value="${esc(item.causaOutro)}" oninput="updateOutro('${item.id}','causaOutro',this.value)"/>
      </div>

      <div class="field-block">
        <span class="field-label">Localiza&ccedil;&atilde;o exata (fra&ccedil;&atilde;o / alçado / zona)</span>
        <input class="form-input" placeholder="ex: Fra&ccedil;&atilde;o B, al&ccedil;ado Sul, junto &agrave; varanda"
          value="${esc(item.local)}" oninput="updateField('${item.id}','local',this.value)"/>
      </div>

      <div class="field-block">
        <span class="field-label">Observa&ccedil;&otilde;es</span>
        <textarea class="form-textarea" placeholder="Notas adicionais&hellip;" oninput="updateField('${item.id}','obs',this.value)">${esc(item.obs)}</textarea>
      </div>

      <div class="field-block">
        <span class="field-label">Fotos (${item.fotos.length})</span>
        <div class="photo-strip">${photosHTML}</div>
        <div class="photo-add-row">
          <button class="btn btn-ghost btn-sm" onclick="triggerPhoto('${item.id}','camera')">&#128247; Tirar foto</button>
          <button class="btn btn-ghost btn-sm" onclick="triggerPhoto('${item.id}','gallery')">&#128193; Carregar</button>
        </div>
      </div>
      ${isCustom ? `<button class="btn btn-danger btn-sm remove-custom" onclick="removeCustom('${item.id}')">&#128465; Remover esta patologia</button>` : ''}
    </div>`;
  }

  return `
  <div class="card ${item.observada?'observed':''}" id="card-${item.id}">
    <div class="card-head" onclick="toggleExpand('${item.id}')">
      ${isCustom ? `<span class="num-badge">NOVA</span>` : `<span class="num-badge">${item.num}</span>`}
      ${titleHTML}
      <div class="card-meta">
        ${item.fotos.length ? `<span class="photo-count">&#128247;${item.fotos.length}</span>` : ''}
        <div class="toggle ${item.observada?'on':''}" onclick="event.stopPropagation();toggleObservada('${item.id}')"><div class="toggle-dot"></div></div>
        <span class="chevron ${isOpen?'open':''}">&#9656;</span>
      </div>
    </div>
    ${body}
  </div>`;
}

function renderList(){
  const q = (document.getElementById('search-input').value||'').toLowerCase().trim();
  const predefFiltered = state.patologias.filter(p=>!q || p.tipo.toLowerCase().includes(q));
  document.getElementById('list-predef').innerHTML = predefFiltered.length
    ? predefFiltered.map(cardHTML).join('')
    : `<div class="empty-state">Sem resultados para &ldquo;${esc(q)}&rdquo;</div>`;

  document.getElementById('list-custom').innerHTML = state.custom.length
    ? state.custom.map(cardHTML).join('')
    : `<div class="empty-state">Nenhuma patologia adicional registada</div>`;

  const nObs = state.patologias.filter(p=>p.observada).length + state.custom.length;
  document.getElementById('counter-val').textContent = `${nObs} / ${state.patologias.length}`;
}

// ── INTERACTIONS ─────────────────────────────────────────────────────────
function toggleExpand(id){
  if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
  renderList();
}
function toggleObservada(id){
  const item = findItem(id);
  item.observada = !item.observada;
  if (item.observada) expandedIds.add(id); else expandedIds.delete(id);
  markDirty();
  renderList();
}
function toggleElemento(id, i, checked){
  const item = findItem(id);
  item.elementosSel[i] = checked;
  markDirty();
  renderList();
}
function toggleCausa(id, i, checked){
  const item = findItem(id);
  item.causasSel[i] = checked;
  markDirty();
  renderList();
}
function updateOutro(id, field, val){
  const item = findItem(id);
  item[field] = val;
  markDirty();
}
function updateField(id, field, val){
  const item = findItem(id);
  item[field] = val;
  markDirty();
}
function updateCustomTitle(id, val){
  const item = findItem(id);
  item.tipo = val;
  markDirty();
}
function addCustom(){
  const id = 'c'+(customSeq++);
  state.custom.push({
    id, num: null, tipo: '', elementos: [], causas: [],
    observada: true, elementosSel: [], elementoOutro: '', causasSel: [], causaOutro: '',
    local: '', obs: '', fotos: []
  });
  expandedIds.add(id);
  markDirty();
  renderList();
  setTimeout(()=>{
    const el = document.querySelector(`#card-${id} .custom-title-input`);
    if (el) el.focus();
  }, 30);
}
function removeCustom(id){
  if (!confirm('Remover esta patologia da ficha?')) return;
  state.custom = state.custom.filter(p=>p.id!==id);
  expandedIds.delete(id);
  markDirty();
  renderList();
}

// ── FOTOS ────────────────────────────────────────────────────────────────
function triggerPhoto(id, mode){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  input.className = 'file-input-hidden';
  if (mode === 'camera') input.setAttribute('capture','environment');
  document.body.appendChild(input);
  input.addEventListener('change', function(){
    handlePhotoFiles(id, input.files);
    document.body.removeChild(input);
  });
  input.click();
}
function resizeImage(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w >= h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoFiles(id, files){
  const item = findItem(id);
  if (!item || !files || !files.length) return;
  for (const file of files) {
    try {
      const dataUrl = await resizeImage(file, 1600, 0.82);
      item.fotos.push({ dataUrl, name: file.name || 'foto.jpg' });
    } catch(e) { console.error(e); }
  }
  markDirty();
  renderList();
  toast(`${files.length} foto(s) adicionada(s)`, 'success');
}
function removePhoto(id, i){
  const item = findItem(id);
  item.fotos.splice(i,1);
  markDirty();
  renderList();
}
function openLightbox(id, i){
  const item = findItem(id);
  document.getElementById('lightbox-img').src = item.fotos[i].dataUrl;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

// ── EXPORT / IMPORT ─────────────────────────────────────────────────────
function exportJSON(){
  readHeader();
  const payload = { _ficha: 'patologias-seen', _versao: 1, exportadoEm: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const proc = (state.header.processo||'obra').replace(/[^a-z0-9.\-]+/gi,'_');
  const dt = state.header.data || new Date().toISOString().split('T')[0];
  a.href = url;
  a.download = `Patologias_${proc}_${dt}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  dirty = false;
  toast('Ficheiro exportado ✓', 'success');
}
function importJSON(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const payload = JSON.parse(e.target.result);
      const loaded = payload.state || payload;
      if (!loaded.header || !loaded.patologias) throw new Error('formato inválido');
      state = loaded;
      state.custom = state.custom || [];
      expandedIds = new Set();
      customSeq = (state.custom.length ? Math.max(...state.custom.map(c=>parseInt(c.id.slice(1))||0)) : 0) + 1;
      writeHeader();
      dirty = false;
      renderList();
      toast('Ficha importada ✓', 'success');
    } catch(err) {
      toast('Erro ao importar ficheiro: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  document.getElementById('import-input').value = '';
}
function resetAll(){
  if (!confirm('Isto apaga todos os dados preenchidos nesta ficha (não guardados). Continuar?')) return;
  initState();
  writeHeader();
  expandedIds = new Set();
  dirty = false;
  renderList();
  toast('Ficha limpa', 'info');
}

function saveAndNew(){
  readHeader();
  const hasContent = observedItems().length > 0 || state.header.processo || state.header.edificio || state.header.localidade;
  if (!hasContent) {
    toast('Ainda não há nada preenchido para guardar', 'info');
    return;
  }
  exportJSON();
  initState();
  writeHeader();
  expandedIds = new Set();
  dirty = false;
  renderList();
  document.getElementById('search-input').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('Ficha guardada ✓ — nova ficha iniciada', 'success');
}

// ── RESUMO ───────────────────────────────────────────────────────────────
function observedItems(){
  return [...state.patologias.filter(p=>p.observada), ...state.custom];
}
function buildSummaryHTML(){
  readHeader();
  const items = observedItems();
  let html = `<div id="summary-header-box">
    <div><b>Processo N.&ordm;:</b> ${esc(state.header.processo)||'&mdash;'}</div>
    <div><b>Data da visita:</b> ${formatDatePT(state.header.data)}</div>
    <div><b>Edif&iacute;cio:</b> ${esc(state.header.edificio)||'&mdash;'}</div>
    <div><b>Localidade:</b> ${esc(state.header.localidade)||'&mdash;'}</div>
    <div><b>T&eacute;cnico(s):</b> ${esc(state.header.tecnico)||'&mdash;'}</div>
    <div><b>Fra&ccedil;&otilde;es visitadas:</b> ${esc(state.header.fracoes)||'&mdash;'}</div>
  </div>`;
  html += `<h2>Patologias Observadas (${items.length})</h2>`;
  if (!items.length) {
    html += `<p style="color:#888">Nenhuma patologia foi marcada como observada nesta visita.</p>`;
  }
  items.forEach((item, idx)=>{
    const elementos = [...item.elementos.filter((e,i)=>item.elementosSel[i]), ...(item.elementoOutro.trim()?[item.elementoOutro.trim()]:[])];
    const causas = [...item.causas.filter((c,i)=>item.causasSel[i]), ...(item.causaOutro.trim()?[item.causaOutro.trim()]:[])];
    html += `<div class="p-block">
      <div class="p-header">${idx+1}. ${esc(item.tipo)||'(sem descri&ccedil;&atilde;o)'}</div>
      <div class="p-row"><b>Elemento construtivo:</b> ${elementos.length?esc(elementos.join(', ')):'&mdash;'}</div>
      <div class="p-row"><b>Causa prov&aacute;vel:</b> ${causas.length?esc(causas.join(', ')):'&mdash;'}</div>
      <div class="p-row"><b>Localiza&ccedil;&atilde;o:</b> ${esc(item.local)||'&mdash;'}</div>
      ${item.obs.trim() ? `<div class="p-row"><b>Observa&ccedil;&otilde;es:</b> ${esc(item.obs)}</div>` : ''}
      ${item.fotos.length ? `<div class="p-photos">${item.fotos.map(f=>`<img src="${f.dataUrl}"/>`).join('')}</div>` : `<div class="p-row" style="color:#999">Sem fotos anexadas</div>`}
    </div>`;
  });
  return html;
}
function openSummary(){
  document.getElementById('summary-output').innerHTML = buildSummaryHTML();
  document.getElementById('modal-summary').classList.add('open');
}
function closeSummary(){
  document.getElementById('modal-summary').classList.remove('open');
}
function copySummaryText(){
  readHeader();
  const items = observedItems();
  let text = `FICHA DE PATOLOGIAS — REGISTO DE VISITA\n`;
  text += `Processo N.º: ${state.header.processo||'—'}\n`;
  text += `Data da visita: ${formatDatePT(state.header.data)}\n`;
  text += `Edifício: ${state.header.edificio||'—'}\n`;
  text += `Localidade: ${state.header.localidade||'—'}\n`;
  text += `Técnico(s): ${state.header.tecnico||'—'}\n`;
  text += `Frações visitadas: ${state.header.fracoes||'—'}\n\n`;
  text += `PATOLOGIAS OBSERVADAS (${items.length})\n`;
  text += '='.repeat(40) + '\n\n';
  items.forEach((item, idx)=>{
    const elementos = [...item.elementos.filter((e,i)=>item.elementosSel[i]), ...(item.elementoOutro.trim()?[item.elementoOutro.trim()]:[])];
    const causas = [...item.causas.filter((c,i)=>item.causasSel[i]), ...(item.causaOutro.trim()?[item.causaOutro.trim()]:[])];
    text += `${idx+1}. ${item.tipo||'(sem descrição)'}\n`;
    text += `   Elemento construtivo: ${elementos.length?elementos.join(', '):'—'}\n`;
    text += `   Causa provável: ${causas.length?causas.join(', '):'—'}\n`;
    text += `   Localização: ${item.local||'—'}\n`;
    if (item.obs.trim()) text += `   Observações: ${item.obs.trim()}\n`;
    text += `   Fotos anexadas: ${item.fotos.length}\n\n`;
  });
  navigator.clipboard.writeText(text).then(
    ()=>toast('Texto copiado ✓','success'),
    ()=>toast('Não foi possível copiar automaticamente','error')
  );
}

// ── TOAST ────────────────────────────────────────────────────────────────
let toastTimer = null;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type||'info'} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

// ── INIT ─────────────────────────────────────────────────────────────────
renderList();
</script>
</body>
</html>
